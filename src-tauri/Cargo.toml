[package]
name = "soft-explorer"
version = "1.0.1"
description = "Lector local de mangas Soft Explorer"
authors = ["Soft Explorer"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "soft_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
sha2 = "0.10"
natord = "1.0"
rars = { version = "0.12.4", default-features = false }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
